<!doctype html>
<html>
  <body style="background-color:#f6f8fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;">
    <div style="margin:0 auto;padding:32px 0;max-width:560px;">
      <div style="background-color:#ffffff;border-radius:12px;padding:32px;border:1px solid #e5e9f0;">
        <h1 style="font-size:20px;font-weight:600;color:#b00020;margin:0 0 4px;">{{ level }}: {{ logger_name }}</h1>

        {% for label, val in [("Timestamp", timestamp), ("Message", message)] %}
        <div style="padding:10px 0;border-bottom:1px solid #f0f2f6;">
          <p style="font-size:12px;text-transform:uppercase;letter-spacing:0.04em;color:#6b7484;margin:0 0 4px;">{{ label }}</p>
          <p style="font-size:15px;color:#0b1220;margin:0;line-height:1.5;">{{ val }}</p>
        </div>
        {% endfor %}

        {% if exc_info %}
        <div style="padding:10px 0;border-bottom:1px solid #f0f2f6;">
          <p style="font-size:12px;text-transform:uppercase;letter-spacing:0.04em;color:#6b7484;margin:0 0 4px;">Exception</p>
          <pre style="font-size:12px;color:#0b1220;margin:0;white-space:pre-wrap;">{{ exc_info }}</pre>
        </div>
        {% endif %}
      </div>
    </div>
  </body>
</html>
